<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Checkout</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .checkout-container {
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 400px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #555;
    }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
  <div class="checkout-container">
    <h2>Checkout</h2>
    <form action="https://formspree.io/f/xbdenwdq" method="POST">
      
      <!-- Customer Info -->
      <label for="name">Full Name</label>
      <input type="text" id="name" name="customer_name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="customer_email" required>

      <label for="number">Number</label>
      <input type="text" id="number" name="customer_number" required>

      <label for="address">Shipping Address</label>
      <textarea id="address" name="shipping_address" rows="3" required></textarea>

      <!-- Product Info -->
      <label for="product">Product</label>
      <select id="product" name="product" required>
        <option value="T-shirt">Smart Bio Clean</option>
        <option value="Hoodie">Master Deluxe</option>
        <option value="Cap">Super Star Cabinet</option>
        <option value="Cap">Mahogany</option>

      </select>

      <label for="quantity">Quantity</label>
      <input type="number" id="quantity" name="quantity" min="1" value="1" required>

      <!-- Hidden fields -->
      <input type="hidden" name="_subject" value="New Order Checkout">
      <input type="hidden" name="_redirect" value="https://yoursite.com/thankyou.html">

      

      <button type="submit">Place Order</button>
    </form>
  </div>
</body>
</html>
